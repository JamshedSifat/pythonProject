<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradient for the main cross -->
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the circle background -->
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b2ebf2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for brain/tech elements -->
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#023e8a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="250" cy="220" r="160" fill="url(#circleGradient)" stroke="#00b4d8" stroke-width="3" opacity="0.9"/>
  
  <!-- Subtle inner circle -->
  <circle cx="250" cy="220" r="140" fill="none" stroke="#0077b6" stroke-width="1" stroke-dasharray="8,6" opacity="0.4"/>
  
  <!-- Medical cross -->
  <g filter="url(#glow)">
    <!-- Vertical bar of cross -->
    <rect x="232" y="120" width="36" height="140" rx="6" fill="url(#crossGradient)"/>
    <!-- Horizontal bar of cross -->
    <rect x="180" y="172" width="140" height="36" rx="6" fill="url(#crossGradient)"/>
  </g>
  
  <!-- Pulse/Heartbeat line at bottom of cross -->
  <polyline points="190,230 210,230 220,215 235,245 250,220 265,250 275,230 295,230" 
            fill="none" stroke="#e63946" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Tech/Digital nodes around the cross -->
  <!-- Left node -->
  <circle cx="160" cy="200" r="6" fill="#00b4d8" opacity="0.8"/>
  <line x1="166" y1="200" x2="180" y2="190" stroke="#00b4d8" stroke-width="2" opacity="0.6"/>
  <circle cx="160" cy="200" r="10" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.4"/>
  
  <!-- Right node -->
  <circle cx="340" cy="200" r="6" fill="#00b4d8" opacity="0.8"/>
  <line x1="334" y1="200" x2="320" y2="190" stroke="#00b4d8" stroke-width="2" opacity="0.6"/>
  <circle cx="340" cy="200" r="10" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.4"/>
  
  <!-- Top node -->
  <circle cx="250" cy="130" r="5" fill="#0077b6" opacity="0.7"/>
  <circle cx="250" cy="130" r="9" fill="none" stroke="#0077b6" stroke-width="1" opacity="0.4"/>
  
  <!-- Connecting lines (circuit traces) -->
  <path d="M160 200 Q150 180 250 145" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="4,3"/>
  <path d="M340 200 Q350 180 250 145" stroke="#00b4d8" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="4,3"/>
  
  <!-- Small data dots -->
  <circle cx="145" cy="180" r="2.5" fill="#48cae4" opacity="0.6"/>
  <circle cx="355" cy="180" r="2.5" fill="#48cae4" opacity="0.6"/>
  <circle cx="250" cy="100" r="2.5" fill="#48cae4" opacity="0.6"/>
  
  <!-- AI/Brain nodes at bottom -->
  <circle cx="195" cy="300" r="4" fill="#e63946" opacity="0.7"/>
  <circle cx="250" cy="308" r="4" fill="#e63946" opacity="0.7"/>
  <circle cx="305" cy="300" r="4" fill="#e63946" opacity="0.7"/>
  
  <!-- Connecting lines bottom -->
  <line x1="195" y1="300" x2="250" y2="308" stroke="#e63946" stroke-width="1.5" opacity="0.5"/>
  <line x1="250" y1="308" x2="305" y2="300" stroke="#e63946" stroke-width="1.5" opacity="0.5"/>
  
 
  
  
</svg>